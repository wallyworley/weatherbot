name: Deploy to VPS

# Auto-deploy on every push to main. Also exposes a manual trigger so you
# can re-run the deploy from the Actions tab (useful if a deploy was
# interrupted, or you've changed something on the VPS by hand and want to
# reset it to match main).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only one deploy runs at a time. If two pushes land in quick succession,
# the second waits for the first to finish — prevents racey half-states
# where rsync from the older commit overwrites the newer.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Shallow clone is fine for rsync; we don't need history.
          fetch-depth: 1

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust the host key on first contact (sshd's pubkey rarely changes)
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync repo to /opt/weather_bot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # Excludes mirror what we don't want overwritten on the VPS:
          #   .env             — VPS-side secrets, never overwrite
          #   .venv/           — VPS-side Python install
          #   logs/            — runtime logs
          #   db/, .cache/     — runtime state
          #   .git/            — VPS isn't a git checkout yet
          #   __pycache__/     — recompiled per-host
          #
          # No --delete: leaves stray files on the VPS alone. Add --delete
          # later once we're confident the workflow is stable.
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='**/__pycache__/' \
            --exclude='*.pyc' \
            --exclude='logs/' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='.cache/' \
            --exclude='.pytest_cache/' \
            --exclude='.sfdx/' \
            --exclude='.claude/' \
            --exclude='db/' \
            --exclude='.DS_Store' \
            --exclude='node_modules/' \
            --exclude='launchd/' \
            ./ "ubuntu@$VPS_HOST:/opt/weather_bot/"

      - name: Bootstrap stations + restart dashboard
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "ubuntu@$VPS_HOST" '
            set -e
            cd /opt/weather_bot
            # Bootstrap any new stations added by this commit (idempotent).
            .venv/bin/python -c "from weather_bot.data import persistence; persistence.bootstrap_stations()"
            # Restart the only long-running daemon. Timers (main, kalshi,
            # metar, nbm, etc.) pick up file changes naturally on next fire.
            sudo -n /usr/bin/systemctl restart weatherbot-dashboard.service
            echo "deploy complete: $(date -u --iso-8601=seconds)"
          '

      - name: Smoke-check VPS picked up the change
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # Verify the current commit SHA appears in a marker the VPS can read.
          # We use a simple file with the SHA so future deploys can confirm
          # what's actually running on disk.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "ubuntu@$VPS_HOST" \
            "echo '${{ github.sha }}' > /opt/weather_bot/.deployed_sha && \
             cat /opt/weather_bot/.deployed_sha"
