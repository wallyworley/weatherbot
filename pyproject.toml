[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-bot"
version = "0.1.0"
description = "Kalshi weather-contract signal bot (NBM + HRRR + METAR pipeline)"
requires-python = ">=3.10"
readme = "setup.md"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "requests>=2.31",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "xarray>=2024.1",
    "cfgrib>=0.9.11",
    "eccodes>=1.7",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "pytz>=2024.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
# Treat the current directory as the package root. The `weather_bot` package
# lives in the same directory as this pyproject.toml (flat layout).
packages = [
    "weather_bot",
    "weather_bot.data",
    "weather_bot.models",
    "weather_bot.strategy",
    "weather_bot.verification",
    "weather_bot.jobs",
    "weather_bot.tests",
]
package-dir = {"weather_bot" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
